faft:
  # 重要性系数 (v) = alpha*O + beta*D + gamma*C
  # 全局默认权重（兜底）
  alpha: 0.34
  beta: 0.33
  gamma: 0.33

  # 差异化权重系数配置
  weights:
    "split-bolt": [0.5, 0.5, 0.0]
    "chaos-bolt": [0.3, 0.3, 0.4]
    "faft-count-bolt": [0.20, 0.60, 0.20]

  # 采样率上下限与步长
  rmin: 0.10
  rmax: 1.00
  step: 0.05

  # 误差阈值
  error-threshold: 0.05

  # 结构依赖的衰减参数（用于 UpDownStreamDependency / OutputImpact）
  omega-in: 0.5    # D(v) 入度敏感度权重
  omega-out: 0.5   # D(v) 出度敏感度权重
  impact-delta: 0.9 # 用于 O(v)

  zk-connect: 192.168.213.130:2181,192.168.213.131:2181,192.168.213.132:2181

  # 校验窗口参数（FaftCountBolt 内部使用）
  verify-interval: 10000   # 每隔多少条 tuple 开启一次校验
  verify-duration: 1000    # 校验窗口持续多少条 tuple
